name: Recover Cloudflare admin password

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to confirm the emergency password reset'
        required: true
        type: string
        default: RESET

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  recover:
    name: Reset password and audit the operation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      # CLOUDFLARE_API_TOKEN is preferred. The API key pair remains supported
      # for accounts that use a Cloudflare Global API Key.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate recovery request
        shell: bash
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESET_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [[ "${RESET_CONFIRM:-}" != "RESET" ]]; then
            echo "::error::Type RESET in the confirmation field to continue."
            exit 1
          fi

          if [[ -z "${ADMIN_PASSWORD:-}" ]]; then
            echo "::error::Missing ADMIN_PASSWORD secret in the production environment."
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret or variable."
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]] && {
            [[ -z "${CLOUDFLARE_API_KEY:-}" ]] || [[ -z "${CLOUDFLARE_EMAIL:-}" ]]
          }; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN, or both CLOUDFLARE_API_KEY and CLOUDFLARE_EMAIL."
            exit 1
          fi

          if ! grep -Eq '"database_id"[[:space:]]*:' wrangler.jsonc; then
            echo "::error::wrangler.jsonc is missing the D1 database_id."
            exit 1
          fi

      - name: Apply remote D1 migrations
        run: npx --no-install wrangler d1 migrations apply bucea-epic-content --remote

      - name: Generate one-time reset SQL
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: node scripts/generate-admin-password-reset.mjs > "${RUNNER_TEMP}/admin-password-reset.sql"

      - name: Apply password reset and audit event
        run: npx --no-install wrangler d1 execute bucea-epic-content --remote --file="${RUNNER_TEMP}/admin-password-reset.sql" --yes

      - name: Synchronize bootstrap secret
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: printf '%s' "$ADMIN_PASSWORD" | npx --no-install wrangler secret put ADMIN_PASSWORD
