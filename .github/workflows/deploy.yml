name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages is a static mirror; public API requests stay on the
      # Cloudflare Workers primary site.
      VITE_API_BASE: https://www.rayspace.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build:static:github
      # _headers is consumed by Cloudflare Workers Assets; GitHub Pages does
      # not interpret it, so keep the static mirror free of deployment metadata.
      - run: rm -f dist/_headers
      # GitHub Pages 没有 SPA 回退机制，用 404.html 兜底 history 模式深链接
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
